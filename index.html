<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDX Dashboard</title>
<style>
  :root {
    --bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;
    --green:#3fb950;--green-bg:#0d2a14;--red:#f85149;--red-bg:#2d0f0f;
    --gold:#e3b341;--blue:#58a6ff;--purple:#bc8cff;--accent:#1f6feb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700;color:var(--blue)}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accent);color:#fff}
  .meta{margin-left:auto;color:var(--muted);font-size:11px;text-align:right}
  .meta span{display:block}
  .refresh-bar{background:var(--card);border-bottom:1px solid var(--border);padding:6px 20px;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .btn-refresh{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;margin-left:auto}
  main{padding:16px 20px;display:grid;gap:16px}
  .cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:900px){.cols3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .card-header{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
  .card-header h2{font-size:13px;font-weight:700}
  .card-header .count{margin-left:auto;background:var(--border);border-radius:10px;padding:1px 8px;font-size:10px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  th{padding:6px 10px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
  td{padding:6px 10px;border-bottom:1px solid #1c2128;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1c2128}
  .code{font-weight:700;color:var(--blue);font-size:12px}
  .price{font-weight:600}
  .vol{color:var(--muted);font-size:11px}
  .pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--muted)}
  .intersection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px}
  .inter-card{background:#1c2128;border-radius:8px;padding:10px 12px;border-left:3px solid var(--gold)}
  .inter-card.triple{border-left-color:var(--purple)}
  .inter-top{display:flex;align-items:center;gap:8px}
  .inter-code{font-weight:700;font-size:14px;color:var(--blue)}
  .inter-change{font-weight:700;margin-left:auto}
  .inter-name{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inter-cats{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .cat-pill{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600}
  .cat-gainer{background:var(--green-bg);color:var(--green)}
  .cat-volume{background:#0d1f3c;color:var(--blue)}
  .cat-value{background:#2a1f0a;color:var(--gold)}
  .watchlist{display:flex;gap:10px;padding:14px;flex-wrap:wrap}
  .watch-card{background:#1c2128;border-radius:8px;padding:12px 14px;flex:1;min-width:160px;border-top:3px solid var(--green)}
  .watch-card .wcode{font-weight:800;font-size:16px;color:var(--green)}
  .watch-card .wname{font-size:10px;color:var(--muted);margin-top:2px}
  .watch-card .wrow{display:flex;justify-content:space-between;margin-top:8px}
  .watch-card .wlabel{font-size:10px;color:var(--muted)}
  .watch-card .wval{font-size:12px;font-weight:600}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .no-data{padding:20px;text-align:center;color:var(--muted);font-size:12px}
  /* Detail button */
  .btn-detail{margin-top:8px;width:100%;background:#1f2d3d;color:var(--blue);border:1px solid #2a4a6b;border-radius:6px;padding:6px 0;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:.3px}
  .btn-detail:hover{background:#1f3d5d}
  /* Modal */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:16px}
  .modal-overlay.open{display:flex}
  .modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal-head{padding:14px 18px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#161b22;z-index:1}
  .m-code{font-size:22px;font-weight:800;color:var(--blue)}
  .m-name{font-size:11px;color:var(--muted)}
  .m-close{margin-left:auto;background:#2d333b;border:none;color:var(--muted);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:16px;line-height:1}
  .m-close:hover{color:var(--text)}
  .modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .signal-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .signal-badge{padding:4px 14px;border-radius:20px;font-size:12px;font-weight:800;letter-spacing:.5px}
  .sig-STRONG-BUY{background:#0d2a14;color:var(--green);border:1px solid var(--green)}
  .sig-BUY{background:#0d1f3c;color:var(--blue);border:1px solid var(--blue)}
  .sig-WATCH{background:#2a2000;color:var(--gold);border:1px solid var(--gold)}
  .sig-WAIT{background:#2d0f0f;color:var(--red);border:1px solid var(--red)}
  .pattern-text{font-size:11px;color:var(--muted)}
  .risk-pill{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700}
  .risk-ceiling{background:#2d0f0f;color:var(--red)}
  .risk-high{background:#2a1500;color:#ff8c00}
  .risk-mod{background:#2a2000;color:var(--gold)}
  .risk-low{background:#0d2a14;color:var(--green)}
  .level-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .level-box{background:#1c2128;border-radius:8px;padding:9px 10px;text-align:center}
  .level-box .lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .level-box .lv{font-size:14px;font-weight:700;margin-top:3px}
  .level-box .sub{font-size:9px;margin-top:2px}
  .sl-box{border:1px solid #2d0f0f}
  .t1-box{border:1px solid #0d2a14}
  .ara-box{border:1px solid #3d2f00}
  .ara-bar-wrap{background:#1c2128;border-radius:8px;padding:10px 12px}
  .ara-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px}
  .ara-bar-track{height:8px;background:#30363d;border-radius:4px;overflow:hidden}
  .ara-bar-fill{height:100%;border-radius:4px}
  .tip-box{background:#0d1f3c;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--text)}
  .modal-cats{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <h1>📊 IDX Dashboard</h1>
  <span class="badge" id="session-badge">–</span>
  <div class="meta">
    <span id="date-display">–</span>
    <span id="time-display" style="color:var(--text);font-weight:600">–</span>
  </div>
  <!-- Visitor counter -->
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)">
    <span>👥</span>
    <span id="visit-count" style="color:var(--text);font-weight:600">–</span>
    <span>kunjungan</span>
  </div>
</header>

<!-- GoatCounter analytics (ganti YOUR_CODE dengan kode dari goatcounter.com) -->
<!-- <script data-goatcounter="https://YOUR_CODE.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script> -->

<div class="refresh-bar">
  <span class="dot"></span>
  <span>Auto update tiap 5 menit (jam bursa)</span>
  <span id="countdown" style="color:var(--text)"></span>
  <button class="btn-refresh" onclick="load()">⟳ Refresh</button>
</div>

<!-- IHSG Bar -->
<div id="ihsg-bar" style="background:#0d1f3c;border-bottom:2px solid #1f6feb;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
  <span style="font-size:12px;color:#58a6ff;font-weight:800;letter-spacing:1px">📊 IHSG</span>
  <span id="ihsg-status" style="font-size:10px;padding:3px 10px;border-radius:10px;font-weight:700;background:#1c2128;color:#8b949e">Loading…</span>
  <span id="ihsg-price" style="font-size:26px;font-weight:800;color:#fff">–</span>
  <span id="ihsg-change" style="font-size:15px;font-weight:700">–</span>
  <span style="color:#30363d">│</span>
  <span id="ihsg-hl" style="font-size:12px;color:#8b949e">H: – &nbsp; L: –</span>
  <span id="ihsg-open" style="font-size:12px;color:#8b949e">Open: –</span>
  <span style="color:#30363d">│</span>
  <span id="ihsg-vol" style="font-size:12px;color:#8b949e">Vol: –</span>
  <span id="ihsg-as-of" style="font-size:10px;color:#8b949e;font-style:italic"></span>
  <span id="ihsg-bar-chart" style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px"></span>
</div>

<main id="main">
  <div class="loading"><div class="spinner"></div>Memuat data…</div>
</main>

<script>
const fmt = (n,d=0) => n==null?'–':Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtV = v => {if(!v)return'–';if(v>=1e12)return(v/1e12).toFixed(2)+'T';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';return(v/1e3).toFixed(0)+'K'};
const clr  = p => p>0?'pos':p<0?'neg':'neu';
const sign = p => p>0?'+':'';

// Baca dari data/latest.json (GitHub Pages sama domain = no CORS)
const DATA_URL = './data/latest.json';

// ── Client-side scalping analysis (no backend needed) ────────────────────────
let _dashData = null;  // semua data dari latest.json disimpan di sini

function _tickRound(p) {
  if (p < 200)  return Math.round(p);
  if (p < 500)  return Math.round(p/2)*2;
  if (p < 2000) return Math.round(p/5)*5;
  if (p < 5000) return Math.round(p/10)*10;
  return Math.round(p/25)*25;
}

function _analyzeStockJS(stock) {
  const price  = stock.price || stock.close || 0;
  const chg    = stock.change_pct || 0;
  const value  = stock.value || 0;
  const cats   = stock.categories || [];
  if (!price) return {};

  const prev   = price / (1 + chg/100);
  const ara    = _tickRound(prev * 1.25);
  const dist   = Math.round((ara - price) / price * 1000) / 10;
  const hit    = dist <= 2;
  const sl     = _tickRound(price * 0.95);
  const t1     = _tickRound(price * 1.04);
  const t2     = dist > 3 ? ara : _tickRound(price * 1.08);
  const rr     = price > sl ? Math.round((t1-price)/(price-sl)*10)/10 : 0;
  const cn     = cats.length;

  let sig, pat;
  if (hit)                        { sig='WAIT';        pat='Mendekati Ceiling ARA'; }
  else if (cn===3 && chg>=15)     { sig='STRONG BUY';  pat='Triple Intersection + Momentum Kuat'; }
  else if (cn===3)                { sig='BUY';         pat='Triple Intersection'; }
  else if (cn===2 && chg>=15)     { sig='BUY';         pat='Double Intersection + Gainer Kuat'; }
  else if (cn===2)                { sig='WATCH';       pat='Double Intersection'; }
  else if (chg>=10)               { sig='WATCH';       pat='Single Momentum Kuat'; }
  else                            { sig='WATCH';       pat='Single Momentum'; }

  let risk, rcls;
  if (hit)        { risk='CEILING'; rcls='risk-ceiling'; }
  else if(chg>=20){ risk='Tinggi';  rcls='risk-high'; }
  else if(chg>=10){ risk='Moderat'; rcls='risk-mod'; }
  else            { risk='Rendah';  rcls='risk-low'; }

  const fmtN = n => Number(n).toLocaleString('id-ID');
  let tip;
  if (hit)
    tip = `Harga sudah di ceiling ARA (Rp${fmtN(ara)}). Tidak ada ruang naik hari ini. Tunggu besok pagi.`;
  else if (cn===3 && dist>=8)
    tip = `Triple intersection, ${dist}% ruang ke ARA Rp${fmtN(ara)}. Entry area sekarang, target 1 Rp${fmtN(t1)} · target 2 Rp${fmtN(t2)}. SL Rp${fmtN(sl)} · R/R ${rr}x.`;
  else if (cn>=2 && dist>=6)
    tip = `Double intersection, ${dist}% ruang ke ARA Rp${fmtN(ara)}. Entry Rp${fmtN(price)}, target Rp${fmtN(t1)}, SL Rp${fmtN(sl)}. Konfirmasi volume sebelum masuk.`;
  else
    tip = `Pantau apakah harga hold di atas Rp${fmtN(sl)}. ARA target Rp${fmtN(ara)} (+${dist}%). Masuk hanya jika volume naik.`;

  return { prev_close:Math.round(prev), ara_price:ara, ara_dist:dist, ara_hit:hit,
           sl, target1:t1, target2:t2, rr, risk, risk_cls:rcls,
           pattern:pat, signal:sig, tip, value_b:Math.round(value/1e9*10)/10, cat_count:cn };
}
// ─────────────────────────────────────────────────────────────────────────────

let nextRefresh = Date.now() + 5*60*1000;

function updateCountdown() {
  const sec = Math.max(0, Math.round((nextRefresh - Date.now()) / 1000));
  const el = document.getElementById('countdown');
  if (el) el.textContent = sec > 0 ? `Update dalam ${sec}s` : 'Mengambil data…';
}

function renderIHSG(ihsg) {
  if (!ihsg) return;
  const isOpen = ihsg.market_open === true;
  const hasData = !!ihsg.close;
  const statusEl = document.getElementById('ihsg-status');
  if (isOpen) {
    statusEl.textContent = '● LIVE';
    statusEl.style.background = 'var(--green-bg)';
    statusEl.style.color = 'var(--green)';
  } else {
    statusEl.textContent = '○ Market Tutup';
    statusEl.style.background = '#1c2128';
    statusEl.style.color = '#8b949e';
  }
  if (!hasData) { document.getElementById('ihsg-price').textContent = 'Tidak ada data'; return; }
  const up = ihsg.change_pct >= 0;
  const col = up ? 'var(--green)' : 'var(--red)';
  document.getElementById('ihsg-price').textContent = fmt(ihsg.close, 2);
  document.getElementById('ihsg-price').style.color = col;
  document.getElementById('ihsg-change').innerHTML = `<span style="color:${col}">${up?'▲':'▼'} ${Math.abs(ihsg.change_abs||0).toFixed(2)} (${up?'+':''}${fmt(ihsg.change_pct,2)}%)</span>`;
  document.getElementById('ihsg-hl').innerHTML = `<span style="color:var(--green)">H: ${fmt(ihsg.high,2)}</span> &nbsp; <span style="color:var(--red)">L: ${fmt(ihsg.low,2)}</span>`;
  document.getElementById('ihsg-open').textContent = `Open: ${fmt(ihsg.open,2)}`;
  document.getElementById('ihsg-vol').textContent = `Vol: ${fmtV(ihsg.volume)}`;
  document.getElementById('ihsg-as-of').textContent = !isOpen && ihsg.as_of ? `Data terakhir: ${ihsg.as_of}` : '';
  if (ihsg.high && ihsg.low && ihsg.high !== ihsg.low) {
    const pct = Math.round(((ihsg.close-ihsg.low)/(ihsg.high-ihsg.low))*100);
    document.getElementById('ihsg-bar-chart').innerHTML = `
      <span style="color:var(--red);font-size:10px">${fmt(ihsg.low,0)}</span>
      <div style="width:120px;height:6px;background:#30363d;border-radius:3px;position:relative">
        <div style="width:${pct}%;height:100%;background:${col};border-radius:3px"></div>
      </div>
      <span style="color:var(--green);font-size:10px">${fmt(ihsg.high,0)}</span>
      <span style="color:#8b949e;font-size:10px">${pct}%</span>`;
  }
}

function renderTable(stocks, type) {
  if (!stocks?.length) return '<div class="no-data">Tidak ada data</div>';
  const val = s => type==='gainer'?`<span class="${clr(s.change_pct)}">${sign(s.change_pct)}${fmt(s.change_pct,2)}%</span>`
    :type==='volume'?`<span class="vol">${fmtV(s.volume)}</span>`
    :`<span class="vol">Rp${fmtV(s.value)}</span>`;
  const col = type==='gainer'?'Change':type==='volume'?'Volume':'Nilai';
  return `<table><thead><tr><th>#</th><th>Kode</th><th>Harga</th><th>${col}</th></tr></thead><tbody>
    ${stocks.slice(0,15).map((s,i)=>`<tr>
      <td class="vol">${i+1}</td>
      <td><span class="code">${s.code}</span><br><span class="vol" style="font-size:10px">${(s.name||'').substring(0,20)}</span></td>
      <td class="price">Rp${fmt(s.price||s.close)}</td>
      <td>${val(s)}</td></tr>`).join('')}
  </tbody></table>`;
}

function renderIntersection(list) {
  if (!list?.length) return '<div class="no-data">Tidak ada saham yang masuk 2+ kategori</div>';
  return `<div class="intersection-grid">${list.map(s=>`
    <div class="inter-card ${s.categories.length===3?'triple':''}">
      <div class="inter-top"><span class="inter-code">${s.code}</span><span class="inter-change ${clr(s.change_pct)}">${sign(s.change_pct)}${fmt(s.change_pct,2)}%</span></div>
      <div class="inter-name">${s.name}</div>
      <div class="inter-cats">
        ${s.categories.includes('gainer')?'<span class="cat-pill cat-gainer">🟢 Gainer</span>':''}
        ${s.categories.includes('volume')?'<span class="cat-pill cat-volume">📈 Volume</span>':''}
        ${s.categories.includes('value')?'<span class="cat-pill cat-value">💰 Value</span>':''}
        ${s.categories.length===3?'<span class="cat-pill" style="background:#1e0d3c;color:var(--purple)">⭐ Triple</span>':''}
      </div>
      <div style="margin-top:6px;font-size:10px;color:var(--muted)">Harga: Rp${fmt(s.price||s.close)} · Vol: ${fmtV(s.volume)}</div>
    </div>`).join('')}</div>`;
}

let _wData = [];
function renderWatchlist(list) {
  if (!list?.length) return '<div class="no-data">Tidak ada data</div>';
  _wData = list;
  return `<div class="watchlist">${list.map((s,i)=>{
    const a = s.analysis||{};
    const sig = (a.signal||'WATCH').replace(' ','-');
    return `
    <div class="watch-card">
      <div class="wcode">${s.code}</div>
      <div class="wname">${(s.name||'').substring(0,28)}</div>
      <div class="wrow">
        <span><span class="wlabel">Harga</span><br><span class="wval">Rp${fmt(s.price||s.close)}</span></span>
        <span><span class="wlabel">Change</span><br><span class="wval ${clr(s.change_pct)}">${sign(s.change_pct)}${fmt(s.change_pct,2)}%</span></span>
        <span><span class="wlabel">Volume</span><br><span class="wval">${fmtV(s.volume)}</span></span>
      </div>
      <div style="margin-top:6px;font-size:10px;color:var(--muted)">
        Nilai: Rp${fmtV(s.value)}
        ${a.signal?`&nbsp;·&nbsp;<span class="signal-badge sig-${sig}" style="font-size:9px;padding:1px 6px">${a.signal}</span>`:''}
      </div>
      <button class="btn-detail" onclick="showDetail(${i})">🔍 Analisa Detail</button>
    </div>`;
  }).join('')}</div>`;
}

function renderWatchlistFull(notes, fallback) {
  const list = notes?.length ? notes : fallback;
  if (!list?.length) return '<div class="no-data">Tidak ada data</div>';
  if (!notes?.length) return renderWatchlist(fallback);

  const catColor = c => c==='gainer'?'cat-gainer':c==='volume'?'cat-volume':'cat-value';
  const catIcon  = c => c==='gainer'?'🟢':c==='volume'?'📈':'💰';

  return `<div style="padding:14px;display:flex;flex-direction:column;gap:12px">
    ${notes.map((s,i)=>`
    <div style="background:#1c2128;border-radius:10px;padding:14px 16px;border-left:4px solid ${s.cats?.length===3?'var(--purple)':'var(--green)'}">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:20px;font-weight:800;color:var(--blue)">${i+1}. ${s.code}</span>
        <span style="font-size:14px;font-weight:700;color:${s.change>=0?'var(--green)':'var(--red)'}">${s.change>=0?'+':''}${(s.change||0).toFixed(2)}%</span>
        <span style="font-size:13px;font-weight:600;color:var(--text)">Rp${fmt(s.price)}</span>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${(s.cats||[]).map(c=>`<span class="cat-pill ${catColor(c)}">${catIcon(c)} ${c}</span>`).join('')}
          ${s.cats?.length===3?'<span class="cat-pill" style="background:#1e0d3c;color:var(--purple)">⭐ Triple</span>':''}
        </div>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">Vol: ${fmtV(s.volume)} | Nilai: Rp${fmtV(s.value)}</span>
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--text);line-height:1.5">${s.reason}</div>
      <div style="margin-top:6px;font-size:11px;color:var(--gold);background:#2a1f0a;padding:5px 10px;border-radius:6px;display:inline-block">${s.guidance}</div>
    </div>`).join('')}
  </div>`;
}

async function analyzeStock() {
  const inp = document.getElementById('stock-input');
  const res = document.getElementById('stock-result');
  const ticker = (inp.value||'').toUpperCase().trim().replace(/[^A-Z0-9]/g,'');
  if (!ticker) { inp.focus(); return; }

  res.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:8px 0">⏳ Mencari ${ticker}…</div>`;

  // Cari di semua array data yang sudah di-load (no backend needed)
  let d = null;
  if (_dashData) {
    const all = [
      ...(_dashData.watchlist   || []),
      ...(_dashData.intersection|| []),
      ...(_dashData.gainers     || []),
      ...(_dashData.volume      || []),
      ...(_dashData.value       || []),
    ];
    const found = all.find(s => (s.code||'').toUpperCase() === ticker);
    if (found) {
      d = {...found};
      d.analysis = found.analysis || _analyzeStockJS(found);
      d.intraday_range_pct = '–';
      d.rel_volume = '–';
      d.rel_vol_label = '–';
      d.sector = found.sector || '–';
      d.high = found.high || found.price;
      d.low  = found.low  || found.price;
    }
  }

  if (!d) {
    res.innerHTML = `<div style="color:var(--muted);font-size:12px;padding:8px 0">⚠️ Data tidak tersedia untuk <strong style="color:var(--text)">${ticker}</strong>.</div>`;
    return;
  }

  const a   = d.analysis || {};
  const sig = (a.signal||'WATCH').replace(' ','-');
  const p   = d.price || 0;
  const araFill  = a.ara_hit ? 100 : Math.min(100, Math.round(((p-(a.prev_close||p))/((a.ara_price||p)-(a.prev_close||p)))*100));
  const araColor = a.ara_hit ? 'var(--red)' : araFill > 70 ? 'var(--gold)' : 'var(--green)';

  res.innerHTML = `
  <div style="background:#1c2128;border-radius:10px;padding:14px 16px;border-left:4px solid ${a.ara_hit?'var(--red)':a.signal==='STRONG BUY'?'var(--green)':'var(--blue)'}">

    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <span style="font-size:22px;font-weight:800;color:var(--blue)">${d.code}</span>
      <span style="font-size:11px;color:var(--muted);flex:1">${(d.name||'').substring(0,36)}</span>
      <span style="font-size:15px;font-weight:700;color:${d.change_pct>=0?'var(--green)':'var(--red)'}">${sign(d.change_pct)}${fmt(d.change_pct,2)}%</span>
      <span style="font-size:16px;font-weight:700">Rp${fmt(p)}</span>
    </div>

    <!-- Signal row -->
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <span class="signal-badge sig-${sig}">${a.signal||'–'}</span>
      <span style="font-size:11px;color:var(--muted)">${a.pattern||'–'}</span>
      <span class="risk-pill ${a.risk_cls||''}" style="margin-left:auto">⚠ ${a.risk||'–'}</span>
    </div>

    <!-- Stats row -->
    <div style="display:flex;gap:16px;font-size:11px;flex-wrap:wrap;margin-bottom:12px">
      <span style="color:var(--muted)">Sektor: <strong style="color:var(--text)">${d.sector||'–'}</strong></span>
      <span style="color:var(--muted)">Rel. Vol: <strong style="color:${d.rel_volume>1.5?'var(--green)':'var(--text)'}">${d.rel_volume}x — ${d.rel_vol_label}</strong></span>
      <span style="color:var(--muted)">Range hari ini: <strong style="color:var(--text)">${d.intraday_range_pct}%</strong></span>
      <span style="color:var(--muted)">Nilai: <strong style="color:var(--text)">Rp${a.value_b||0}B</strong></span>
    </div>

    <!-- Levels -->
    <div class="level-grid" style="margin-bottom:12px">
      <div class="level-box sl-box">
        <div class="lbl">Stop Loss</div>
        <div class="lv" style="color:var(--red)">${fmt(a.sl||0)}</div>
        <div class="sub" style="color:var(--red)">−${fmt(p&&a.sl?((p-a.sl)/p*100):0,1)}%</div>
      </div>
      <div class="level-box t1-box">
        <div class="lbl">Target 1</div>
        <div class="lv" style="color:var(--green)">${fmt(a.target1||0)}</div>
        <div class="sub" style="color:var(--green)">+${fmt(p&&a.target1?((a.target1-p)/p*100):0,1)}%</div>
      </div>
      <div class="level-box ara-box">
        <div class="lbl">Target 2 / ARA</div>
        <div class="lv" style="color:var(--gold)">${fmt(a.target2||0)}</div>
        <div class="sub" style="color:var(--gold)">+${fmt(p&&a.target2?((a.target2-p)/p*100):0,1)}%</div>
      </div>
    </div>

    <!-- R/R + ARA info -->
    <div style="display:flex;gap:16px;font-size:11px;flex-wrap:wrap;margin-bottom:10px">
      <span style="color:var(--muted)">R/R: <strong style="color:var(--text)">${a.rr||0}x</strong></span>
      <span style="color:var(--muted)">ARA: <strong style="color:var(--gold)">Rp${fmt(a.ara_price||0)}</strong></span>
      <span style="color:var(--muted)">Sisa ke ARA: <strong style="color:${a.ara_hit?'var(--red)':'var(--green)'}">${a.ara_dist||0}%</strong></span>
      <span style="color:var(--muted)">H: <strong style="color:var(--green)">${fmt(d.high)}</strong> &nbsp; L: <strong style="color:var(--red)">${fmt(d.low)}</strong></span>
    </div>

    <!-- ARA bar -->
    <div class="ara-bar-wrap" style="margin-bottom:12px">
      <div class="ara-bar-label">
        <span>Prev Rp${fmt(a.prev_close||0)}</span>
        <span>Sekarang Rp${fmt(p)}</span>
        <span>ARA Rp${fmt(a.ara_price||0)}</span>
      </div>
      <div class="ara-bar-track"><div class="ara-bar-fill" style="width:${araFill}%;background:${araColor}"></div></div>
      <div style="font-size:9px;color:var(--muted);margin-top:4px;text-align:center">
        ${a.ara_hit?'🔴 Sudah di ceiling ARA':`Sudah naik ${araFill}% dari jarak ke ARA`}
      </div>
    </div>

    <!-- Tip -->
    <div class="tip-box">💡 <strong>Pro tip:</strong> ${a.tip||'–'}</div>

    <div style="font-size:10px;color:var(--muted);margin-top:8px;text-align:right">Data real-time via TradingView Scanner</div>
  </div>`;
}
